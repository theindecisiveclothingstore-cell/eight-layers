<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Octagon Case</title>
<style>
:root{--bg:#1c5050;--ink:#e9ecf2;--mute:#9aa3b5;--gold:#d3d7dd;--line:rgba(214,218,224,.55)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-weight:300;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.mono{font-weight:400;letter-spacing:.22em;text-transform:uppercase;font-size:11px;color:var(--gold)}
.serif{font-family:"Times New Roman",Times,serif;font-weight:400}
#top{position:fixed;top:0;left:0;right:0;display:flex;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px 0;z-index:5;pointer-events:none;opacity:0;transition:opacity .8s}
#top.on{opacity:1}
.logo{width:148px;height:auto;margin-bottom:28px;display:block}
.logoTop{height:17px;width:auto;opacity:.9}
#panel{position:fixed;left:0;right:0;bottom:0;padding:0 16px calc(22px + env(safe-area-inset-bottom));z-index:4;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:0;transform:translateY(10px);transition:opacity .6s,transform .6s;pointer-events:none}
#panel.on{opacity:1;transform:none;pointer-events:auto}
#panel::before{content:"";position:absolute;left:0;right:0;bottom:0;top:-90px;background:linear-gradient(to bottom,rgba(28,80,80,0),rgba(28,80,80,.88) 45%,rgba(28,80,80,.96));z-index:-1;pointer-events:none}
#cap{max-width:440px;min-height:112px;transition:opacity .35s}
#cap.swap{opacity:0}
#capTitle{font-size:30px;line-height:1.1;margin:8px 0 6px}
#capLine{font-size:15px;line-height:1.45;color:var(--mute)}
#pips{display:flex;gap:8px;margin:14px 0 16px}
.pip{width:9px;height:9px;clip-path:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%);background:rgba(255,255,255,.18);transition:background .4s}
.pip.on{background:var(--gold)}
.btn{font-family:inherit;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);background:rgba(28,80,80,.35);border:1px solid var(--line);padding:15px 26px;min-width:220px;cursor:pointer;transition:background .3s,border-color .3s;text-decoration:none;display:inline-block}
.btn:hover{background:rgba(214,218,224,.12);border-color:var(--gold)}
.btn.glow{border-color:var(--gold);color:var(--gold);animation:glowp 2s ease-in-out infinite}
@keyframes glowp{0%,100%{box-shadow:0 0 0 rgba(214,218,224,0)}50%{box-shadow:0 0 22px rgba(214,218,224,.35)}}
.overlay{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 16px;transition:opacity 1.2s}
#intro{background:radial-gradient(ellipse at 50% 42%,rgba(36,96,96,.80) 0%,rgba(28,80,80,.94) 70%);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#intro.gone{opacity:0;pointer-events:none}
#intro .title{font-size:52px;line-height:1;margin:18px 0 10px}
#for{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:22px;margin-bottom:6px}
#intro p{color:var(--mute);font-size:15px;line-height:1.5;max-width:290px;margin:10px 0 34px}
.foot{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:16px;right:16px;font-size:10px;letter-spacing:.06em;color:rgba(154,163,181,.6);line-height:1.5}
.link{background:none;border:none;color:var(--gold);font-family:inherit;font-size:10px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;padding:10px;margin-top:4px}
body.board #top,body.board #panel,body.board #intro{display:none}
@media (min-width:700px){#capTitle{font-size:36px}#intro .title{font-size:68px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="top"><img id="logoTop" class="logoTop" alt="AP × Apple"></div>
<div id="panel">
  <div id="cap"><div class="mono" id="capNum"></div><div class="serif" id="capTitle"></div><div id="capLine"></div></div>
  <div id="pips"></div>
  <button class="btn" id="next">Release the strap</button>
  <button class="link" id="replay" style="display:none">Close the case</button>
</div>
<div class="overlay" id="intro">
  <img id="logoIntro" class="logo" alt="AP × Apple">
  <div class="mono" id="tierLine">A private delivery</div>
  <div class="serif title">The Octagon Case.</div>
  <div id="for"></div>
  <p>Turn your sound on. Then open the case, one layer at a time.</p>
  <button class="btn" id="begin">Begin</button>
  <div class="foot">Student concept by Om Chheda · Istituto Marangoni. Not affiliated with or endorsed by Audemars Piguet or Apple.</div>
</div>

let ac=null,master=null;
function initAudio(){try{ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.8;master.connect(ac.destination);ac.resume&&ac.resume();}catch(e){ac=null;}}
const SCALE=[0,4,7,12,16,19];
function chime(i){if(!ac)return;const t=ac.currentTime,f=392*Math.pow(2,SCALE[i%6]/12);
  [1,2.01,3.03].forEach((m,k)=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=f*m;const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07/(k+1),t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+1.8/(k+1));o.connect(g);g.connect(master);o.start(t);o.stop(t+2);});}
function thud(){if(!ac)return;const t=ac.currentTime,o=ac.createOscillator();o.type='sine';o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(40,t+.2);const g=ac.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.5,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.35);o.connect(g);g.connect(master);o.start(t);o.stop(t+.4);}

function frame(){
  if(halted)return;requestAnimationFrame(frame);
  const now=performance.now()/1000,dt=Math.min(.05,now-last);last=now;
  const k=instant?1:1-Math.exp(-dt*2.6);
  for(const n in objs){const t=pose(n),c=cur[n];for(let i=0;i<6;i++)c[i]+=(t[i]-c[i])*k;}
  /* the folio and tray rise straight up before moving, so nothing passes through the walls */
  lidCur+=(lidTarget()-lidCur)*(instant?1:1-Math.exp(-dt*2.2));
  apply();
  if(!drag){yaw*=1-Math.min(1,dt*1.1);pitch*=1-Math.min(1,dt*1.1);}
  const sway=fixedYaw!==null?fixedYaw:(.22*Math.sin(now*.3));
  pivot.rotation.set(pitch,yaw+sway,0);
  /* framing: keep the whole spread clear of the caption panel */
  const Hh=innerHeight,panelPx=(!BOARD&&$('panel').classList.contains('on'))?$('panel').offsetHeight:0,topPx=BOARD?0:50;
  const spread=step>=3?9.6:5.8,tall=step>=3?8.2:5.0;
  const frac=Math.max(.4,(Hh-panelPx-topPx)/Hh),tn=Math.tan(camera.fov*T/360);
  const dist=Math.max(tall/frac/(2*tn),spread/(2*tn*camera.aspect))*(BOARD?1.3:1);
  const el=.62,dir=new THREE.Vector3(0,Math.sin(el),Math.cos(el));
  const visH=2*tn*dist,shift=((panelPx-topPx)/2/Hh)*visH;
  camera.position.copy(look).addScaledVector(dir,dist);camera.position.y-=shift*Math.cos(el);camera.position.z+=shift*Math.sin(el);
  camera.lookAt(look.x,look.y-shift*Math.cos(el),look.z+shift*Math.sin(el));
  renderer.render(scene,camera);
}
apply();frame();
window.__dbg={go:n=>{step=n;if(phase==='intro'&&!BOARD)$('begin').click();setCaption();},instant:v=>{instant=v;},yaw:v=>{fixedYaw=v;},grab:()=>{halted=true;return canvas.toDataURL('image/png');}};
})();
